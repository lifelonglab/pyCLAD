name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install linters
        run: pip install ".[lint]"
      - name: black
        run: black --check src examples tests
      - name: isort
        run: isort --check-only src examples tests
      - name: flake8
        run: flake8 src examples tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Read the Docs builds with this version (.readthedocs.yaml).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      # Fails on broken links, missing snippets and other warnings. The snippets themselves run in the test job.
      - name: mkdocs build
        run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # The default torch wheel brings several GB of CUDA libraries the runner cannot use.
      # Installed first, the CPU build already satisfies the torch requirement of the extras below.
      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install pyclad
        run: pip install -e ".[dev]"
      # Tests marked longrun download datasets and are skipped unless --longrun is given.
      - name: pytest
        run: pytest tests
