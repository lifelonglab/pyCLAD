[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyclad"
description = "Python Library for Continual Lifelong Anomaly Detection"
version = "0.3.0"
dependencies = [
    "datasets>=3.5.0",
    "huggingface_hub>=0.24.0",
    "matplotlib>=3.8.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "pyod>=2.0.1",
    "codecarbon>=3.0.2",
    "pydantic>=2.11.2",
]
requires-python = ">= 3.10"
authors = [
    { name = "Kamil Faber", email = "kfaber@agh.edu.pl" },
    { name = "Roberto Corizzo", email = "rcorizzo@american.edu" }
]
maintainers = [
    { name = "Kamil Faber", email = "kfaber@agh.edu.pl" },
    { name = "Roberto Corizzo", email = "rcorizzo@american.edu" },
    { name = "Mateusz Smendowski", email = "smendowski@agh.edu.pl"}
]
readme = "README.md"
license = { text = "MIT License" }
keywords = ["continual anomaly detection", "continual learning", "anomaly detection", "lifelong learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

#[project.urls]
#Homepage = "https://example.com"
#Documentation = "https://readthedocs.org"
#Repository = "https://github.com/me/spam.git"
#Issues = "https://github.com/me/spam/issues"
#Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# Deep learning models (autoencoders, CARLA) and the strategies that train them (EWC, LwF, DER++, A-GEM).
torch = ["torch>=2.0", "pytorch-lightning>=2.0"]
# Everything under pyclad.vision except UCAD and ReplayCAD, which need their own extra on top.
vision = [
    "pyclad[torch]",
    "torchvision>=0.15",
    "pillow>=10.0",
    "open_clip_torch>=2.24,<3.0",
]
ucad = [
    "pyclad[vision]",
    "timm>=1.0",
    "segment-anything>=1.0",
]
replaycad = [
    "pyclad[vision]",
    "diffusers>=0.31",
    "transformers>=4.44",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "segment-anything>=1.0",
]
all = ["pyclad[torch,vision,ucad,replaycad]"]
dev = [
    "pyclad[vision]",
    "black>=24.4",
    "flake8>=7.1.0",
    "isort>=5.13.0",
    "pytest>=8.2.2",
]

[tool.hatch.build.targets.sdist]
# An explicit list, because hatch otherwise ships everything not matched by the repository's .gitignore,
# including files that are only ignored through a global or local (.git/info/exclude) rule.
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = [
  ".", "src",
]
markers = [
    "longrun: marks tests that take long time to execute (for example downloading big files). These tests are disabled by default, you can run them adding flag `--longrun` to `pytest`)",
]